[project]
name = "visionrag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymilvus>=2.4",
    "tritonclient[all]>=2.49",
    "unstructured[all-docs]>=0.15",
    "paddleocr>=2.8",
    "transformers>=4.45",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "minio>=7.2",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"