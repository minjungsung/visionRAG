[project]
name = "visionrag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymilvus>=2.4",
    "sentence-transformers>=3.0",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "minio>=7.2",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
gpu = [
    "tritonclient[all]>=2.49",
]
ocr = [
    "unstructured[pdf]>=0.15",
    "paddleocr>=2.8",
    "transformers>=4.45",
]
mlops = [
    "langsmith>=0.1.99",
    "langchain-core>=0.3",
    "clearml>=1.16",
    "dvc[s3]>=3.55",
    "deepchecks>=0.18",
]
eval = [
    "ragas>=0.2",
    "datasets>=2.0",
    "langchain-openai>=0.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]
"scripts/prepare_data.py" = ["SIM115"]
"src/api/main.py" = ["B008"]
"app.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "src.api.main:app"
