[project]
name = "visionrag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faiss-cpu>=1.7",
    "sentence-transformers>=3.0",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "minio>=7.2.20",
    "pydantic-settings>=2.15.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "ruff>=0.6",
]
gpu = [
    "tritonclient[all]>=2.49",
]
ocr = [
    "unstructured[pdf]>=0.15",
    "paddleocr>=3.7.0",
    "transformers>=5.17.0",
]
mlops = [
    "langsmith>=0.1.99",
    "langchain-core>=1.6.5",
    "clearml>=1.16",
    "dvc[s3]>=3.55",
    "deepchecks>=0.18",
]
eval = [
    "ragas>=0.4.3",
    "datasets>=5.0.1",
    "langchain-openai>=1.6.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]
"scripts/prepare_data.py" = ["SIM115"]
"src/api/main.py" = ["B008"]
"app.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "src.api.main:app"
