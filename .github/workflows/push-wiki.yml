name: Push Wiki
on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:
jobs:
  push-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Push wiki pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d wiki ]; then echo "No wiki/ directory"; exit 0; fi
          git config --global user.email "minjungsung1994@gmail.com"
          git config --global user.name "minjungsung"
          TMPDIR=$(mktemp -d)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" "$TMPDIR" 2>/dev/null || {
            echo "Wiki not initialized. Please create the first page manually at:"
            echo "https://github.com/${{ github.repository }}/wiki/_new"
            exit 0
          }
          cp wiki/*.md "$TMPDIR/"
          cd "$TMPDIR"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "docs: update wiki pages"
            git push
            echo "Wiki updated successfully"
          fi
