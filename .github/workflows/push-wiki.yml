name: Push Wiki
on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify-publication:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/strict-project-validation.yml
  push-wiki:
    needs: verify-publication
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Push wiki pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ ! -d wiki ]; then echo "No wiki/ directory"; exit 0; fi
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          wiki_directory=$(mktemp -d)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.wiki.git" "$wiki_directory"
          cp wiki/*.md "$wiki_directory/"
          cd "$wiki_directory"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "docs: update wiki pages"
            git push
            echo "Wiki updated successfully"
          fi
